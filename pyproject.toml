[project]
name = "mazegen"
version = "0.1.0"
description = ""
authors = [
    {name = "apinho-a, adaferna"}
]
requires-python = ">=3.10"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "mazegen"},
]

[dependency-groups]
dev = [
    "mypy (>=2.4.1,<3.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
